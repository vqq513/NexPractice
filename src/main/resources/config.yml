# Player match statistics persistence. This controls wins/losses/kills/deaths and the per-kit rank derived from wins.
# Other plugin data (coins, cosmetics, kit profiles, arena definitions, and player preferences) stays in its existing YAML file.
# First switch from server to MySQL/MongoDB automatically imports leaderboards.yml only when the selected database is empty.
storage:
  # server = local leaderboards.yml; mysql = MySQL/MariaDB; mongodb = MongoDB.
  backend: server
  mysql:
    host: '127.0.0.1'
    port: 3306
    database: vprac
    username: vprac
    password: 'change-me'
    use-ssl: false
    table-prefix: 'vprac_'
  mongodb:
    # URI can include authentication, replica set, and TLS options; protect this file if it contains credentials.
    uri: 'mongodb://127.0.0.1:27017'
    database: vprac
    collection: player_stats

# Time shown in the first line of the lobby scoreboard. Use e.g. GMT+03:00, GMT+04:00 or GMT+05:00.
lobby-clock:
  timezone: 'GMT+03:00'
  # Java DateTimeFormatter pattern. Default renders as Oct 22, 21:16 (no GMT suffix).
  format: 'MMM dd, HH:mm'

# Optional FancyHolograms-backed per-kit leaderboards. Install FancyHolograms to enable /vhg.
# Each leaderboard is one multi-line text hologram. FancyHolograms CENTER billboarding makes the
# complete text face each viewer client-side; NexPractice does not rotate/move display parts on player movement.
# Left/right-click anywhere on the display opens a period picker because FancyHolograms text itself
# currently has no native click actions. This is one fixed interaction hitbox per board, not per-line targets.
# DAILY rolls over at 00:00 in this timezone, WEEKLY follows ISO weeks (Monday start), MONTHLY at month start.
leaderboards:
  holograms:
    enabled: true
    timezone: 'GMT+03:00'
    # Number of minutes before the hologram advances to the next kit. This also drives the displayed countdown.
    cycle-interval-minutes: 10
    # Size of the one stationary hitbox used to open the period picker. This is not the display itself.
    click-width: 6.0
    click-height: 4.5
    text-scale: 0.7
    selected-label-format: '&e&l[{label}]'
    label-format: '&a[{label}]'
    separator: '&7-'
    title-format: '&b&l{metric} Leaderboards'
    kit-format: '&e&l{kit}'
    player-row-format: '&6#{place} &7- &f{player} &7- &6{value}'
    empty-row-format: '&7#{place} &7- &8No player'
    timer-format: '&fNext update in {time}'

# Respawn behavior. This is a Minecraft world gamerule; when enabled it removes the vanilla
# death screen for ALL players in each loaded world, not only NexPractice match participants.
respawn:
  immediate-respawn: true

# NexPractice queue item settings.
# The first hotbar slot is inventory slot 0.
queue-item-slot: 0
queue-item-name: '&bQueues&8(&7Right Click&8)'
queue-item-attack-speed: 20.0

# Settings for special NexPractice items. Golden Head is a custom-textured PLAYER_HEAD.
# Special fireballs break at most a 3-wide by 2-high panel on the impact plane. When a kit
# has Destroy / Break blocks disabled, fireballs may remove only blocks placed during that match.
# Fireball knockback is the final velocity applied to living entities within 4.5 blocks; values are velocity units.
special-items:
  fireball:
    knockback:
      horizontal: 3.5
      vertical: 4.5

# Dialogs are the native, server-sent Minecraft GUI available in Java 1.21.6+.
# A fully transparent custom background is not supported by the vanilla Dialog API.

# The /vsetlobby command saves lobby-spawn.* here. Until it is set,
# players return to their pre-match location / world spawn fallback.

# Configurable messages sent when the match is found.
# Placeholders: %map%, %opponent%, %opponent_rank% (also %rank% / %their_rank%),
# %opponent_ping% (also %their_ping%), %kit%, %player_name%, %player_rank%, %player_ping%.
# Set enabled to false to hide these messages. Each list entry is one chat line; "" adds a blank line.
match-statics:
  enabled: true
  lines:
  - '&6Match Statics:'
  - ''
  - '&6Map: &f%map%'
  - '&6Opponent: &f%opponent%'
  - '&6Rank: &f%opponent_rank%'
  - '&6Their Ping: &f%opponent_ping%ms'

# Configurable post-match report messages. %winner% and %loser% remain clickable
# so participants can open the saved match-inventory report. Set enabled to false to hide them.
match-info:
  enabled: true
  lines:
  - '&6Match Info:'
  - '&fWinner: %winner%'
  - '&fLoser: %loser%'
  - '&8————————'

# Fully configurable FastBoard sidebar layouts.
# Edit the title and lines below without changing Java files. Lines are shown from top to bottom.
# Use & color codes, blank entries (""), built-in placeholders, NexPractice placeholders, and PlaceholderAPI.
# Quick placeholders: %player_name%, %player_ping%, %server_online%, %vprac_status%, %vprac_kit%,
# %vprac_opponent%, %vprac_match_time%, %vprac_match_kills%, %vprac_round_score%, %vprac_opponent_round_score%, %vprac_wins%, %vprac_losses%, %vprac_kdr%.
# Full reference: NexPractice-Server/SCOREBOARD_PLACEHOLDERS.md in the source ZIP.
# Minecraft sidebar scoreboards support up to 15 lines per layout.
# /vscoreboard reload applies config changes without restarting the server.
scoreboard:
  enabled: true
  # How often to refresh placeholder values. 20 ticks = 1 second. Allowed range: 1-1200 ticks.
  update-interval-ticks: 20

  lobby:
    enabled: true
    title: '&6Your Server'
    lines:
    - '&7&l⌚ &7%vprac_date%'
    - ''
    - '&b⚔ &fFighting: &6%vprac_fighting%'
    - '&a⌛ &fQueueing: &6%vprac_queueing%'
    - ''
    - ''
    - '&fOnline:'
    - '&6%server_online%'
    - ''
    - '&7&oServer.ip'

  match:
    enabled: true
    title: '&6Your Server'
    lines:
    - '&cFight'
    - ''
    - '🛈 &fScore: &c%vprac_round_score%&7 - &c%vprac_opponent_round_score%'
    - ''
    - '&fOpponent: &b%vprac_opponent%'
    - '&fYour Ping: %player_ping_color%%player_ping%ms'
    - '&fTheir Ping: %vprac_opponent_ping%'
    - ''
    - '&7&oServer.ip'

  # Used automatically for solo queue matches whose kit requires multiple round wins.
  # Direct duels, tournament bouts, Bedfight and party matches keep their existing layouts.
  match-multiround:
    enabled: true
    title: '&6Your Server'
    lines:
    - ''
    - '&fOpponent: &b%vprac_opponent%'
    - ''
    - '&fⓘ Score: &b%vprac_round_score% &8- &c%vprac_opponent_round_score%'
    - ''
    - '&fYour Ping: %player_ping_color%%player_ping%ms'
    - '&fTheir Ping: %vprac_opponent_ping%'
    - ''
    - '&7&oServer.ip'

  # Dedicated sidebar shown only during Party FFA fights. Counts update throughout the match.
  party-ffa:
    enabled: true
    title: '&6Your Server'
    lines:
    - ''
    - '&eKills: &6%vprac_match_kills%'
    - ''
    - '&ePlayers: &e%vprac_party_players_alive%/%vprac_party_players_total%'
    - ''
    - '&7Your Ping: %player_ping_color%%player_ping%ms'
    - ''
    - '&7&oServer.ip'

  # Dedicated sidebar shown only during Party Split fights.
  party-split:
    enabled: true
    title: '&6Your Server'
    lines:
    - ''
    - '&7&lYour Team'
    - '&9%vprac_party_team_alive%/%vprac_party_team_total%'
    - ''
    - '&7&lTheir Team'
    - '&c%vprac_party_enemy_alive%/%vprac_party_enemy_total%'
    - ''
    - '&7Your Ping: %player_ping_color%%player_ping%ms'
    - ''
    - '&7&oServer.ip'

  # Dedicated sidebar for Party Split matches on Bedfight-enabled arenas.
  # Minecraft sidebars support at most 15 lines, so this layout condenses the extra blank separators.
  party-split-bedfight:
    enabled: true
    title: '&6Your Server'
    lines:
    - '&cBed Fight &7(Party Split)'
    - ''
    - '&f&lBeds'
    - '&f Your Team: %vprac_bed_self_color%%vprac_bed_self_mark%'
    - '&f Enemy Team: %vprac_bed_opponent_color%%vprac_bed_opponent_mark%'
    - ''
    - '&7&lYour Team'
    - '&9%vprac_party_team_alive%/%vprac_party_team_total%'
    - '&7&lTheir Team'
    - '&c%vprac_party_enemy_alive%/%vprac_party_enemy_total%'
    - ''
    - '&f&lKills: &c%vprac_match_kills%'
    - '&fYour Ping: %player_ping_color%%player_ping%ms'
    - ''
    - '&7&oServer.ip'

  # Dedicated sidebar for queue matches whose selected arena has Bedfight enabled.
  # %vprac_bed_self_color% and %vprac_bed_opponent_color% follow each side's team color.
  # The corresponding *_mark placeholder is ✔ while that bed can still respawn its owner, otherwise ✘.
  bedfight:
    enabled: true
    title: '&6Your Server'
    lines:
    - ''
    - '&cFight'
    - ''
    - '&fOpponent: &b%vprac_opponent%'
    - ''
    - '&f&lBeds'
    - '&f You: %vprac_bed_self_color%%vprac_bed_self_mark%'
    - '&f Them: %vprac_bed_opponent_color%%vprac_bed_opponent_mark%'
    - ''
    - '&fYour Ping: %player_ping_color%%player_ping%ms'
    - '&fTheir Ping: %vprac_opponent_ping%'
    - ''
    - '&f&lKills: &c%vprac_match_kills%'
    - ''
    - '&7&oServer.ip'

  # Ping placeholder colors used by %player_ping_color% and related match lines.
  ping-colors:
    green-below-ms: 60
    yellow-below-ms: 120
    good: '&a'
    medium: '&e'
    high: '&c'
# Cosmetic options and behavior are editable here. Changes apply after /vscoreboard reload.
# Player selections are stored separately in plugins/NexPractice/cosmetics.yml.
# Per-kit gameplay rule toggles, including unlimited-hunger, are stored in plugins/NexPractice/kit-rules.yml.
# When unlimited-hunger is false, vanilla hunger runs on Easy/Normal/Hard and drains through exhaustion (sprinting, jumping, combat movement), not while idle. Peaceful worlds disable vanilla hunger drain, so NexPractice uses an exhaustion fallback for normal-hunger kits without changing the world difficulty.
# Set enabled: false to hide an option. Use valid Bukkit Material, Particle, trim pattern and trim material names.
# Trail options: particle is the Bukkit Particle enum; particles-per-step controls density along each projectile step;
# offset-x/y/z controls spread, extra controls particle-specific speed/extra data, interval-ticks is the update frequency,
# and max-lifetime-ticks limits how long a trail can stay alive. Higher counts/density and shorter intervals cost more.
# Kill effects: particle is the main Bukkit Particle; particle-count is burst size; offset-x/y/z controls spread;
# extra is particle-specific speed/extra data. secondary-particle adds a second burst (blank disables it) with its own count/spread/extra.
# Kill messages: name and description control the menu item; template is the actual broadcast and uses {killer}/{victim}.
# Armor trims: pattern selects the trim shape; trim-material selects its accent material on all 4 armor pieces.
# Valid vanilla trim-material values on Paper 1.21.11: AMETHYST, COPPER, DIAMOND, EMERALD, GOLD, IRON, LAPIS,
# NETHERITE, QUARTZ, REDSTONE, RESIN. Valid pattern keys are the pattern names used by the entries below.
# For all cosmetics, enabled hides/shows the option; name, description, and icon control its menu entry.
cosmetics:
  # Category labels and descriptions displayed in the Cosmetics menu.
  categories:
    projectile-trails:
      title: '&8Projectile Trails'
      name: '&eProjectile Trails'
      description: '&7Particle effects that follow projectiles that you throw.'
      icon: BOW
    kill-messages:
      title: '&8Kill Messages'
      name: '&eKill Messages'
      description: '&7Make every kill message your own.'
      icon: ANVIL
    kill-effects:
      title: '&8Kill Effects'
      name: '&eKill Effects'
      description: '&7Particle effects that play when you kill other players.'
      icon: DIAMOND_SWORD
    armor-trims:
      title: '&8Armor Trims'
      name: '&eArmor Trims'
